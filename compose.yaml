version: '3.8'

services:
  # Banco de dados para produção
  postgres_prod:
    image: 'postgres:latest'
    container_name: postgres_prod
    environment:
      - 'POSTGRES_DB=urlmapping'
      - 'POSTGRES_PASSWORD=root'
      - 'POSTGRES_USER=root'
    ports:
      - '5433:5432'
    networks:
      - urlmapping_network
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  # Banco de dados para testes
  postgres_test:
    image: 'postgres:latest'
    container_name: postgres_test
    environment:
      - 'POSTGRES_DB=urlmapping_test'
      - 'POSTGRES_PASSWORD=root'
      - 'POSTGRES_USER=root'
    ports:
      - '5434:5432'
    networks:
      - urlmapping_network
    volumes:
      - postgres_data_test:/var/lib/postgresql/data

networks:
  urlmapping_network:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
  postgres_data_test:
    driver: local
